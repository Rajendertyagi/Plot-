name: Build Windows x64 Portable ZIP

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable-windows:
    name: Build Self-Contained Windows x64 Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun (Latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun & Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust Stable Toolchain (x86_64 Windows)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependencies Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Frontend Dependencies with Bun
        run: bun install

      - name: Build Web Production Assets with Bun
        run: bun run build

      - name: Build Tauri Desktop Executable (x86_64 Release)
        run: bun run tauri build --no-bundle

      - name: Assemble Self-Contained Portable Directory Structure
        run: bun run package:portable
        env:
          CI: true

      - name: Compress into Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "projectflow-windows-x64-portable" -DestinationPath "projectflow-windows-x64-portable.zip" -Force
          Write-Host "Portable ZIP created successfully: projectflow-windows-x64-portable.zip"

      - name: Upload Portable ZIP as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectflow-windows-x64-portable
          path: projectflow-windows-x64-portable.zip
          retention-days: 30

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: projectflow-windows-x64-portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
