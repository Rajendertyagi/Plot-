name: Build Windows x64 Portable ZIP

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable-windows:
    name: Build Self-Contained Windows x64 Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun (Latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun & Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust Stable Toolchain (x86_64 Windows)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependencies Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Frontend Dependencies with Bun
        run: bun install

      - name: Build Web Production Assets with Bun
        run: bun run build

      - name: Build Tauri Desktop Executable (x86_64 Release)
        run: bun run tauri build --no-bundle

      - name: Assemble Self-Contained Portable Directory Structure
        shell: pwsh
        run: |
          # Clean any existing portable build directory to prevent stale/extra files
          if (Test-Path "projectflow-windows-x64-portable") {
            Remove-Item -Path "projectflow-windows-x64-portable" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "projectflow-windows-x64-portable\web" | Out-Null
          New-Item -ItemType Directory -Force -Path "projectflow-windows-x64-portable\data\webview" | Out-Null

          # Copy compiled web assets
          if (Test-Path "dist") {
            Copy-Item -Path "dist\*" -Destination "projectflow-windows-x64-portable\web" -Recurse -Force
            Write-Host "[OK] Copied web assets to ./web"
          }

          # Copy or create initial data stores safely
          if (Test-Path "data\projects.json") {
            Copy-Item -Path "data\projects.json" -Destination "projectflow-windows-x64-portable\data\projects.json" -Force
          } else {
            Set-Content -Path "projectflow-windows-x64-portable\data\projects.json" -Value '{"projects":[],"features":[],"tasks":[],"viewLayout":"tree"}' -Encoding utf8
          }

          if (Test-Path "data\prompts.json") {
            Copy-Item -Path "data\prompts.json" -Destination "projectflow-windows-x64-portable\data\prompts.json" -Force
          } else {
            Set-Content -Path "projectflow-windows-x64-portable\data\prompts.json" -Value '[]' -Encoding utf8
          }
          Write-Host "[OK] Local data isolated in ./data"

          # Copy launchers and documents safely (No dev files like package.json)
          @("start-web-mode.bat", "start-desktop-mode.bat", "README.txt") | ForEach-Object {
            if (Test-Path $_) {
              Copy-Item -Path $_ -Destination "projectflow-windows-x64-portable\" -Force
            }
          }

          # Copy compiled Tauri executable
          if (Test-Path "src-tauri\target\release\projectflow.exe") {
            Copy-Item -Path "src-tauri\target\release\projectflow.exe" -Destination "projectflow-windows-x64-portable\projectflow.exe" -Force
            Write-Host "[OK] Copied projectflow.exe from src-tauri\target\release"
          } elseif (Test-Path "target\release\projectflow.exe") {
            Copy-Item -Path "target\release\projectflow.exe" -Destination "projectflow-windows-x64-portable\projectflow.exe" -Force
            Write-Host "[OK] Copied projectflow.exe from target\release"
          } else {
            Write-Error "[FATAL] projectflow.exe was not found in release target directories."
            exit 1
          }
          Write-Host "[DONE] Self-contained portable structure assembled successfully."

      - name: Compress into Portable ZIP for GitHub Releases
        shell: pwsh
        run: |
          Compress-Archive -Path "projectflow-windows-x64-portable\*" -DestinationPath "projectflow-windows-x64-portable.zip" -Force
          Write-Host "Portable ZIP created successfully for GitHub Releases"

      - name: Upload Portable Package as Workflow Artifact (No Nested Zip)
        uses: actions/upload-artifact@v4
        with:
          name: projectflow-windows-x64-portable
          path: projectflow-windows-x64-portable/
          retention-days: 30

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: projectflow-windows-x64-portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
