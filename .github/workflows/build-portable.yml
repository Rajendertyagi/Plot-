name: Build Windows x64 Portable ZIP

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable-windows:
    name: Build Self-Contained Windows x64 Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun (Latest)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun & Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust Stable Toolchain (x86_64 Windows)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Dependencies Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Frontend Dependencies with Bun
        run: bun install

      - name: Build Web Production Assets with Bun
        run: bun run build

      - name: Build Tauri Desktop Executable (x86_64 Release)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Assemble Self-Contained Portable Directory Structure
        shell: pwsh
        run: |
          $DistDir = "projectflow-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $DistDir
          New-Item -ItemType Directory -Force -Path "$DistDir/web"
          New-Item -ItemType Directory -Force -Path "$DistDir/data"
          New-Item -ItemType Directory -Force -Path "$DistDir/data/webview"

          # 1. Copy compiled Windows executable (supports both target layouts)
          if (Test-Path "src-tauri/target/release/projectflow.exe") {
            Copy-Item "src-tauri/target/release/projectflow.exe" -Destination "$DistDir/projectflow.exe"
          } elseif (Test-Path "target/release/projectflow.exe") {
            Copy-Item "target/release/projectflow.exe" -Destination "$DistDir/projectflow.exe"
          } else {
            throw "Executable projectflow.exe not found in target directories"
          }

          # 2. Place web frontend folder directly next to the executable
          Copy-Item -Recurse "dist/*" -Destination "$DistDir/web"

          # 3. Copy starter projects database
          if (Test-Path "data/projects.json") {
            Copy-Item "data/projects.json" -Destination "$DistDir/data/projects.json"
          } else {
            '{"projects":[],"features":[],"tasks":[],"viewLayout":"tree"}' | Out-File -Encoding utf8 "$DistDir/data/projects.json"
          }

          # 4. Copy launcher batch scripts & docs
          Copy-Item "start-web-mode.bat" -Destination "$DistDir/start-web-mode.bat"
          Copy-Item "start-desktop-mode.bat" -Destination "$DistDir/start-desktop-mode.bat"
          Copy-Item "README.txt" -Destination "$DistDir/README.txt"

          # 5. Compress into final portable zip
          Compress-Archive -Path "$DistDir" -DestinationPath "projectflow-windows-x64-portable.zip" -Force
          Write-Host "Portable ZIP created successfully: projectflow-windows-x64-portable.zip"

      - name: Upload Portable ZIP as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectflow-windows-x64-portable
          path: projectflow-windows-x64-portable.zip
          retention-days: 30

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: projectflow-windows-x64-portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
