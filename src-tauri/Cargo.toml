[package]
name = "projectflow"
version = "1.0.0"
description = "ProjectFlow - Self-Contained Portable Project & Task Manager"
authors = ["ProjectFlow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
webbrowser = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
